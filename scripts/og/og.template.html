<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:500;src:url(__F500__) format("woff2")}
@font-face{font-family:Inter;font-weight:700;src:url(__F700__) format("woff2")}
html,body{margin:0;padding:0}
body{width:1200px;height:630px;background:#faf9f6;color:#1c1917;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
/* Same ink sketch as SkylineFooter, at its light-mode opacity. */
.skyline{position:absolute;left:0;bottom:0;width:1200px;height:auto;display:block;opacity:0.8}
.row{position:absolute;left:96px;top:72px;display:flex;align-items:center;gap:60px}
.photo{width:240px;height:240px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 6px #faf9f6,0 0 0 8px #e7e5e4}
.text{display:flex;flex-direction:column;gap:16px}
.name{font-size:76px;font-weight:700;letter-spacing:-0.035em;line-height:1;margin:0}
.role{font-size:32px;font-weight:500;color:#57534e;letter-spacing:-0.01em;line-height:1.2;margin:0}
.url{position:absolute;right:96px;top:44px;font-size:22px;font-weight:500;color:#57534e;letter-spacing:0.01em}
</style></head><body>
<img class="skyline" src="../../public/indy-skyline-sketch.webp">
<div class="url">beckyschmidt.me</div>
<div class="row">
  <img class="photo" src="headshot.png">
  <div class="text">
    <h1 class="name">Becky Schmidt</h1>
    <p class="role">Senior Product Manager · Indianapolis</p>
  </div>
</div>
</body></html>
